
name: Build EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64

      - name: Compile C++ menjadi EXE
        run: |
          x86_64-w64-mingw32-g++ -std=c++17 -x c++ struk -o struk.exe

      - name: Upload file EXE
        uses: actions/upload-artifact@v4
        with:
          name: struk-exe
          path: struk.exe
